#orderEmail
mail.orderEmail.subject=A reader wants to buy your book!
mail.orderEmail.buy=The reader {0} {1} is interested in buying "{2}".
mail.orderEmail.notify=We will notify you once the reader makes the payment and send you the receipt so that you can verify it.

#registerEmail
mail.registerEmail.subject=Welcome to Cybrary!
mail.registerEmail.welcome=Hello {0} {1}! Please click below to validate your email address and start using your account
mail.registerEmail.validate=Validate
mail.registerEmail.expiration=This link is valid until {0}

#resetPasswordEmail
mail.resetPasswordEmail.subject=Cybrary password reset
mail.resetPasswordEmail.body=Click the button below to create a new Cybrary password. If you did not request this link, you can safely ignore this email.
mail.resetPasswordEmail.button=Reset password
mail.resetPasswordEmail.expiration=This link is valid until {0}


#receiptUploadedEmail
mail.receiptUploadedEmail.subject=A reader has purchased your book!
mail.receiptUploadedEmail.body=The reader {0} {1} has purchased "{2}". Please click below to verify the payment receipt and give the reader access to your book.
mail.receiptUploadedEmail.button=Sales

#receiptReuploadedEmail
mail.receiptReuploadedEmail.subject=A reader has reuploaded their receipt
mail.receiptReuploadedEmail.body=The reader {0} {1} has reuploaded their receipt for "{2}". Please click below to verify the payment receipt and give the reader access to your book.
mail.receiptReuploadedEmail.button=Sales

#receiptApprovedEmail
mail.receiptApprovedEmail.subject=Your new book is now available to read!
mail.receiptApprovedEmail.body=Your purchase for "{0}" has been approved. You can now access and download it from Cybrary!
mail.receiptApprovedEmail.button=Read "{0}"

#receiptDeniedEmail
mail.receiptDeniedEmail.subject=Your purchase has been denied
mail.receiptDeniedEmail.body=Your purchase for "{0}" has been denied. Please try re-uploading the correct receipt to prove your payment.
mail.receiptDeniedEmail.button=Purchases

#missingInfoEmail
mail.missingInfo.subject=You have paused publications
mail.missingInfo.body=Your publications have been paused until you add your payment information and upload the complete books. Click below to go to your profile and add the missing data.
mail.missingInfo.button=Go to your profile

