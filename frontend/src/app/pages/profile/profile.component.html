@if (displayInfo$ | async; as displayInfo){
	<div class="container">
		<app-profile-header
				[user]="displayInfo?.user!"
				[ownsProfile]="displayInfo?.isOwner!"
		></app-profile-header>
	</div>
	<app-profile-tabs
		[user]="displayInfo?.user!"
		[ownsProfile]="displayInfo?.isOwner!"
	></app-profile-tabs>
}
