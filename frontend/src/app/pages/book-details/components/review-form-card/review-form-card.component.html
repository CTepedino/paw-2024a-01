<h2 mat-dialog-title class="title">
	@if (edit){
		Change your review
	} @else {
		Leave a review
	}
</h2>
<div mat-dialog-content>
	<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form" mat-dialog-content>
		<div class="form-input">
			<ngb-rating class="star-rating"
						formControlName="rating"
						[max]="5"
						[resettable]="true"
			></ngb-rating>
		</div>
		<div class="form-input">
			<mat-form-field appearance="outline" class="input">
				<mat-label>Review</mat-label>
				<textarea matInput #reviewText required class="textarea" maxlength="500" formControlName="review"></textarea>
				<mat-hint align="end">{{reviewText.value.length}} / 500</mat-hint>
			</mat-form-field>
		</div>
	</form>
</div>
<div class="btn-zone" mat-dialog-actions>
	<app-action-button [disabled]="!form.valid" (click)="onSubmit()" submit>
		Set review
	</app-action-button>
	<app-cancel-button (click)="cancelReview()">
		Cancel
	</app-cancel-button>
</div>
