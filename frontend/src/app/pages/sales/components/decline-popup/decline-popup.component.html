<form [formGroup]="form" (ngSubmit)="onSubmit()">
	<h1 i18n mat-dialog-title>Payment Approval</h1>
	<div mat-dialog-content>
		<p i18n>Are you sure you want to decline payment?</p>
		<mat-form-field class="full-width">
			<mat-label i18n>Reason for payment rejection</mat-label>
			<input matInput required maxlength="255" formControlName="reason">
		</mat-form-field>
	</div>
	<div mat-dialog-actions>
		<button i18n mat-button class="cancel-button" (click)="closeDialog()" type="button">CANCEL</button>
		<button i18n mat-button class="decline-button" (click)="onSubmit()" type="submit" [disabled]="!this.form.valid">DECLINE</button>
	</div>
</form>
