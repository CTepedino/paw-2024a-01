<h1 mat-dialog-title>{{ 'SALES.PAYMENT_APPROVAL.TITTLE' | translate }}</h1>
<div mat-dialog-content>
    <p>{{ 'SALES.PAYMENT_APPROVAL.CONFIRMATION_MESSAGE' | translate }}</p>
</div>
<div mat-dialog-actions>
    <button mat-button class="cancel-button" (click)="closeDialog()">{{ 'SALES.PAYMENT_APPROVAL.CANCEL_BUTTON' | translate }}</button>
    <button mat-button class="accept-button" (click)="accept()">{{ 'SALES.PAYMENT_APPROVAL.ACCEPT_BUTTON' | translate }}</button>
</div>
