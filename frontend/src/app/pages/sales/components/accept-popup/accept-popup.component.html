<h1 i18n mat-dialog-title>Payment Approval</h1>
<div mat-dialog-content>
    <p i18n>Are you sure you want to accept payment?</p>
</div>
<div mat-dialog-actions>
    <button i18n mat-button class="cancel-button" (click)="closeDialog()">CANCEL</button>
    <button i18n mat-button class="accept-button" (click)="accept()">ACCEPT</button>
</div>
