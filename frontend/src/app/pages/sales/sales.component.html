<div class="container sales">
    <h1 i18n class="page-title">My Sales</h1>

    <mat-grid-list cols="2" rowHeight="5:1" gutterSize="10px">
        <mat-grid-tile>
            <mat-form-field class="full-width">
                <mat-label i18n>Title</mat-label>
                <input matInput>
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile>
            <mat-form-field class="full-width">
                <mat-label i18n>Select order status</mat-label>
                <mat-select [(value)]="selectedStatus">
                    @for (status of orderStatusOptions; track status.value){
                        <mat-option [value]="status.value"> {{ status.label }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </mat-grid-tile>
    </mat-grid-list>

    @if (orders.length === 0) {
        <div class="centerer big-font">
            <h5 i18n>No sales found</h5>
        </div>
    }

    @if (orders.length != 0) {
        <mat-grid-list cols="5" rowHeight="3:1" gutterSize="20px" class="table-top">
            <mat-grid-tile i18n class="table-title center-left">Cover</mat-grid-tile>
            <mat-grid-tile i18n class="table-title center-left">Book</mat-grid-tile>
            <mat-grid-tile i18n class="table-title center-left">Date</mat-grid-tile>
            <mat-grid-tile i18n class="table-title center-left">Status</mat-grid-tile>
            <mat-grid-tile i18n class="table-title center-left">Actions</mat-grid-tile>
        </mat-grid-list>
    }

</div>
