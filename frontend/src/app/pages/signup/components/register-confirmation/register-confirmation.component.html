<app-notification-card>
	<card-title>{{ 'REGISTRATION.SUCCESS' | translate }}</card-title>
	<card-text>
		<p class="register-confirmation">{{ 'REGISTRATION.CONFIRMATION' | translate }}</p>
		<div class="resend-button">
			<app-action-button [disabled]="disableResend" (click)="resendEmail()">{{ 'REGISTRATION.RESEND_EMAIL' | translate }}</app-action-button>
		</div>
	</card-text>
</app-notification-card>
