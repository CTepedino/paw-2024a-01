<mat-form-field appearance="outline" class="password-input">
	<mat-label>Password</mat-label>
	<input matInput [type]="hide() ? 'password' : 'text'" required/>
	<button
		mat-icon-button
		matSuffix
		(click)="clickEvent($event)"
	>
		<mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
	</button>
</mat-form-field>
