<mat-card class="book-card">
	<mat-card-header>
		<img mat-card-image src="assets/book-cover.jpg" alt="Book cover" class="book-image">
	
		<mat-card-content class="book-content">
			<h2 class="book-title">{{book().title}}</h2>
			<p>By {{writer().firstName}} {{writer().lastName}}</p>
			<p class="book-genre">{{book().genre}}</p>
			<div class="book-details">
				<span><mat-icon>star</mat-icon>{{book().averageRating | number: '1.1-2'}}</span>
				<span><mat-icon>face</mat-icon>+{{book().suggestedAge}}</span>
				<span><mat-icon>description</mat-icon>{{book().pageCount}}</span>
				<span><mat-icon>calendar_today</mat-icon>{{book().publishDate | date: 'yyyy'}}</span>
			</div>
			<p class="price">${{book().price | number}}</p>
		</mat-card-content>
	</mat-card-header>
</mat-card>
